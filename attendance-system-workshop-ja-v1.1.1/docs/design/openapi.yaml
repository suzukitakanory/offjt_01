openapi: 3.0.3
info:
  title: 勤怠管理システム API
  description: |
    勤怠管理システムのREST API仕様書
    
    ## 概要
    従業員の勤怠記録、休暇申請、カレンダー操作を提供するAPIです。
    
  version: 1.0.0
  contact:
    name: 勤怠システム開発チーム
servers:
  - url: http://localhost:8080
    description: 開発環境
  - url: https://api.attendance.example.com
    description: 本番環境

tags:
  - name: health
    description: システムヘルスチェック
  - name: attendance
    description: 勤怠記録管理
  - name: leave
    description: 休暇記録管理（単一デモ従業員用）

paths:
  /actuator/health:
    get:
      tags:
        - health
      summary: システムヘルスチェック
      description: |
        システムの稼働状況を確認する
        関連要件: REQ-UC001
      operationId: healthCheck
      responses:
        '200':
          description: システム正常稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: 正常稼働中
                  value:
                    status: UP
                    components:
                      db:
                        status: UP
                        details:
                          database: PostgreSQL
                          validationQuery: isValid()
                      diskSpace:
                        status: UP
                        details:
                          total: 499963174912
                          free: 123456789012
                          threshold: 10485760
                          exists: true
                      ping:
                        status: UP
        '503':
          description: システム異常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unhealthy:
                  summary: データベース接続エラー
                  value:
                    status: DOWN
                    components:
                      db:
                        status: DOWN
                        details:
                          error: "org.springframework.jdbc.CannotGetJdbcConnectionException"
                      diskSpace:
                        status: UP
                        details:
                          total: 499963174912
                          free: 123456789012
                          threshold: 10485760
                          exists: true
                      ping:
                        status: UP

  /api/attendance:
    post:
      tags:
        - attendance
      summary: 勤怠レコード登録・更新
      description: |
        従業員と日付の 1 件を登録または更新する。
        関連要件: UC003（勤務時間入力）

        **REQ-UC003**:
        リクエストは WorkTimeRequest。出勤・退勤は必須で、status は WORK。
        同じ従業員と日付があれば更新し、無ければ作成する。検証失敗時は保存しない。
        成功時の画面メッセージは SUCCESS02001。API 本体は勤怠レコードを返す。

      operationId: saveAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkTimeRequest'
            examples:
              workTime:
                summary: 勤務時間の保存
                value:
                  employeeId: EMP001
                  attendanceDate: "2025-01-15"
                  clockInTime: "09:00"
                  clockOutTime: "18:00"
                  status: WORK
      responses:
        '200':
          description: 勤怠レコード保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
              example:
                id: 1
                employeeId: EMP001
                attendanceDate: "2025-01-15"
                clockInTime: "09:00:00"
                clockOutTime: "18:00:00"
                status: WORK
                notes: null
                createdAt: "2025-01-15T09:00:00Z"
                updatedAt: "2025-01-15T09:00:00Z"
        '400':
          description: |
            バリデーションエラー。レコードは保存しない。
            ERR03001（前後・同刻）、ERR03002（時刻形式）、ERR03003（未入力）、
            または従業員ID・日付の形式不正。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                clockOrder:
                  summary: 出勤が退勤より前でない
                  value:
                    error: ERR03001
                    message: 出勤時刻は退勤時刻より前である必要があります
                    timestamp: "2025-01-15T09:00:00Z"
                timeFormat:
                  summary: 時刻形式が不正
                  value:
                    error: ERR03002
                    message: 有効な時刻形式で入力してください
                    timestamp: "2025-01-15T09:00:00Z"
                requiredTimes:
                  summary: 時刻未入力
                  value:
                    error: ERR03003
                    message: 出勤時刻と退勤時刻を入力してください
                    timestamp: "2025-01-15T09:00:00Z"

  /api/leaves:
    get:
      tags:
        - leave
      summary: デモ従業員の休暇を期間で取得する
      description: |
        休暇ステータスの行だけを返す。勤務のみの日は含めない。
        従業員IDはサーバー設定（デモ環境の既定値 EMP001）から取得し、要求では指定しない。
        SCR-003 の初期表示では使わず、`GET /api/leaves/{date}` を使う。
        関連要件: REQ-UC004（休暇登録）
      operationId: listLeaves
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 開始日。指定する場合は to も必須
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 終了日。指定する場合は from も必須
      responses:
        '200':
          description: 休暇の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRecord'
        '400':
          description: 期間の片方だけが指定されている、または日付が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR03008
                message: 開始日と終了日は両方指定してください
                timestamp: "2026-11-09T09:00:00Z"
    post:
      tags:
        - leave
      summary: 休暇を新規登録する
      description: |
        行がない日は休暇を新規作成する。
        休暇行がある日は既存行を変えずに409 ERR02003を返す。
        勤務行がある日は、confirmReplaceWork が true でないとき409 ERR02005を返し、時刻を変えない。
        true のときだけ同じ行を休暇にし、出勤・退勤時刻を空にして200を返す。新しい行は作らない。
        従業員IDはサーバー設定（デモ環境の既定値 EMP001）から取得し、要求では指定しない。
        認証・従業員間のアクセス制御を提供しないデモ用途のAPIであり、本番環境に公開しない。
        関連要件: REQ-UC004（休暇登録）
      operationId: createLeave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
            example:
              date: "2026-11-09"
              leaveType: "Sick Leave"
              memo: 体調不良
      responses:
        '201':
          description: 行がなかった日に休暇を作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRecord'
              example:
                date: "2026-11-09"
                leaveType: "Sick Leave"
                memo: 体調不良
        '200':
          description: 確認済みの勤務行を休暇に変えた。出勤・退勤時刻は空である
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRecord'
              example:
                date: "2026-11-09"
                leaveType: "Sick Leave"
                memo: 体調不良
        '400':
          description: 日付、休暇区分、またはメモの入力が不正。error は ERR03004、ERR03005、ERR03006、ERR03007 のいずれか
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingType:
                  summary: 休暇区分が未選択
                  value:
                    error: ERR03005
                    message: 休暇区分を選択してください
                    timestamp: "2026-11-09T09:00:00Z"
                unsupportedType:
                  summary: 未対応の休暇区分
                  value:
                    error: ERR03006
                    message: 対応する休暇区分を選択してください
                    timestamp: "2026-11-09T09:00:00Z"
                memoTooLong:
                  summary: メモが501文字以上
                  value:
                    error: ERR03007
                    message: メモは500文字以内で入力してください
                    timestamp: "2026-11-09T09:00:00Z"
        '409':
          description: 休暇行がある、または勤務日の確認がない。確認前は既存行を変更しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                existingLeave:
                  summary: 休暇行が既にある
                  value:
                    error: ERR02003
                    message: この日付にはすでに休暇が登録されています。変更または削除を使ってください
                    timestamp: "2026-11-09T09:00:00Z"
                workRequiresConfirmation:
                  summary: 勤務行があり確認していない
                  value:
                    error: ERR02005
                    message: この日付には勤務時間が登録されています。休暇にすると出勤・退勤時刻は削除されます
                    timestamp: "2026-11-09T09:00:00Z"

  /api/leaves/{date}:
    parameters:
      - name: date
        in: path
        required: true
        description: 休暇日（YYYY-MM-DD）
        schema:
          type: string
          format: date
        example: "2026-11-09"
    get:
      tags:
        - leave
      summary: 日付で休暇を取得する
      description: 休暇レコードがない場合（通常の勤怠レコードのみの場合を含む）は404を返す。
      operationId: getLeaveByDate
      responses:
        '200':
          description: 休暇を取得した。メモなしは空文字
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRecord'
              example:
                date: "2026-11-09"
                leaveType: "Sick Leave"
                memo: 体調不良
        '400':
          description: 日付の形式または値が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR03004
                message: 休暇日を指定してください
                timestamp: "2026-11-09T09:00:00Z"
        '404':
          description: 指定日付に休暇がない。勤務のみの日も含む。SCR-003 の初期表示では画面エラーにしない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR02002
                message: 指定した日付の休暇はありません
                timestamp: "2026-11-09T09:00:00Z"
    put:
      tags:
        - leave
      summary: 登録済みの休暇を変更する
      description: 対象がない場合は新規作成せず404を返す。休暇日は変更しない。
      operationId: updateLeaveByDate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeaveRequest'
      responses:
        '200':
          description: 休暇を更新した。日付と勤務時刻は変えない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRecord'
              example:
                date: "2026-11-09"
                leaveType: "Personal Leave"
                memo: 私用
        '400':
          description: 休暇区分またはメモの入力が不正。error は ERR03005、ERR03006、ERR03007 のいずれか
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR03006
                message: 対応する休暇区分を選択してください
                timestamp: "2026-11-09T09:00:00Z"
        '404':
          description: 指定日付に更新可能な休暇がない。新規作成しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR02002
                message: 指定した日付の休暇はありません
                timestamp: "2026-11-09T09:00:00Z"
    delete:
      tags:
        - leave
      summary: 登録済みの休暇を削除する
      description: 休暇以外の勤怠レコードは削除しない。
      operationId: deleteLeaveByDate
      responses:
        '204':
          description: 休暇を削除した。応答ボディはない
        '400':
          description: 日付の形式または値が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR03004
                message: 休暇日を指定してください
                timestamp: "2026-11-09T09:00:00Z"
        '404':
          description: 指定日付に削除可能な休暇がない。勤務行は削除しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR02002
                message: 指定した日付の休暇はありません
                timestamp: "2026-11-09T09:00:00Z"

  /api/attendance/{employeeId}/{date}:
    get:
      tags:
        - attendance
      summary: 特定日の勤怠レコード取得
      description: |
        指定した従業員の指定日の勤怠レコードを取得する
        関連要件: UC003（勤務時間入力）
      operationId: getAttendanceByDate
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            pattern: '^EMP[0-9]{3}$'
          description: "従業員ID（例: EMP001）"
          example: EMP001
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
          description: "勤怠日（YYYY-MM-DD形式）。未来日も指定できる"
          example: "2025-01-15"
      responses:
        '200':
          description: 勤怠レコード取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
              example:
                id: 1
                employeeId: EMP001
                attendanceDate: "2025-01-15"
                clockInTime: "09:00:00"
                clockOutTime: "18:00:00"
                status: WORK
                notes: null
                createdAt: "2025-01-15T09:00:00Z"
                updatedAt: "2025-01-15T09:00:00Z"
        '400':
          description: 従業員IDまたは日付の形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid employee ID format"
                message: "従業員IDの形式が不正です"
                timestamp: "2025-01-15T09:00:00Z"
        '404':
          description: 勤怠レコードが見つからない。メッセージは ERR02001。SCR-002 の初期表示では画面エラーにしない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ERR02001
                message: 指定した日付の勤怠レコードはありません
                timestamp: "2025-01-15T09:00:00Z"

  /api/attendance/{employeeId}:
    get:
      tags:
        - attendance
      summary: 従業員の勤怠レコード一覧取得
      description: |
        指定した従業員のすべての勤怠レコードを取得する
        関連要件: REQ-UC002（カレンダー操作）, REQ-UC003（勤務時間入力）
        
        **REQ-UC002での利用**:
        将来的にカレンダー画面で勤怠状態を表示する際に使用する予定。
        現在の実装では、カレンダー操作はフロントエンドのみで完結しており、
        このAPIは呼び出されません。

        **REQ-UC003での利用**:
        機能要件として一覧取得を維持する。勤務時間入力ダイアログは特定日取得を使い、
        カレンダーの勤怠バッジ表示には使わない。未登録でも 200 と空配列を返す。
      operationId: getAttendancesByEmployeeId
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            pattern: '^EMP[0-9]{3}$'
          description: "従業員ID（例: EMP001）"
          example: EMP001
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 取得開始日（YYYY-MM-DD形式）。指定した場合、この日付以降のレコードを取得
          example: "2024-11-01"
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 取得終了日（YYYY-MM-DD形式）。指定した場合、この日付以前のレコードを取得
          example: "2024-11-30"
      responses:
        '200':
          description: 勤怠レコード一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'
              examples:
                multipleRecords:
                  summary: 複数の勤怠レコード
                  value:
                    - id: 1
                      employeeId: "EMP001"
                      attendanceDate: "2024-11-18"
                      clockInTime: "09:00:00"
                      clockOutTime: "18:00:00"
                      status: "WORK"
                      notes: null
                      createdAt: "2024-11-18T09:00:00Z"
                      updatedAt: "2024-11-18T18:00:00Z"
                    - id: 2
                      employeeId: "EMP001"
                      attendanceDate: "2024-11-19"
                      clockInTime: null
                      clockOutTime: null
                      status: "PAID_LEAVE"
                      notes: "家族旅行"
                      createdAt: "2024-11-19T08:00:00Z"
                      updatedAt: "2024-11-19T08:00:00Z"
                emptyList:
                  summary: レコードなし
                  value: []
        '400':
          description: バリデーションエラー（従業員IDの形式が不正など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid employee ID format"
                message: "従業員IDの形式が不正です"
                timestamp: "2024-11-18T10:00:00Z"

components:
  schemas:
    # ==========================================
    # REQ-UC001: システムヘルスチェック
    # ==========================================
    HealthResponse:
      type: object
      description: システムヘルスチェックのレスポンス
      required:
        - status
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
          description: |
            システム全体のステータス
            - UP: 正常稼働中
            - DOWN: システム異常
            - OUT_OF_SERVICE: サービス停止中
            - UNKNOWN: 不明
          example: UP
        components:
          type: object
          description: 各コンポーネントの詳細ステータス
          properties:
            db:
              $ref: '#/components/schemas/ComponentHealth'
            diskSpace:
              $ref: '#/components/schemas/ComponentHealth'
            ping:
              $ref: '#/components/schemas/ComponentHealth'
    
    ComponentHealth:
      type: object
      description: 個別コンポーネントのヘルス情報
      required:
        - status
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
          description: コンポーネントのステータス
          example: UP
        details:
          type: object
          description: コンポーネント固有の詳細情報
          additionalProperties: true
          example:
            database: PostgreSQL
            validationQuery: isValid()

    # ==========================================
    # REQ-UC003: 勤務時間入力
    # ==========================================
    WorkTimeRequest:
      type: object
      description: |
        勤務時間の登録・更新リクエスト。
        秒は送らない。保存時に 00 秒として TIME へ格納する。
        notes は送らない。更新時も既存の備考は変更しない。
      required:
        - employeeId
        - attendanceDate
        - clockInTime
        - clockOutTime
        - status
      properties:
        employeeId:
          type: string
          pattern: '^EMP[0-9]{3}$'
          description: "従業員ID。認証実装までは EMP001"
          example: EMP001
        attendanceDate:
          type: string
          format: date
          description: "勤怠日（YYYY-MM-DD）。未来日を許可する"
          example: "2025-01-15"
        clockInTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: "出勤時刻（HH:MM）。退勤時刻より前"
          example: "09:00"
        clockOutTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: "退勤時刻（HH:MM）。出勤時刻より後。同刻不可"
          example: "18:00"
        status:
          type: string
          enum: [WORK]
          description: UC003 では WORK 固定
          example: WORK

    # REQ-UC002, UC003, UC004: 勤怠レコード管理
    # ==========================================
    AttendanceRecord:
      type: object
      description: 勤怠レコード
      required:
        - id
        - employeeId
        - attendanceDate
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: 勤怠レコードID（主キー）
          example: 1
        employeeId:
          type: string
          pattern: '^EMP[0-9]{3}$'
          description: 従業員ID
          example: "EMP001"
        attendanceDate:
          type: string
          format: date
          description: 勤怠日（YYYY-MM-DD形式）
          example: "2024-11-18"
        clockInTime:
          type: string
          format: time
          nullable: true
          description: |
            出勤時刻（HH:MM:SS形式）
            休暇の場合はnull
          example: "09:00:00"
        clockOutTime:
          type: string
          format: time
          nullable: true
          description: |
            退勤時刻（HH:MM:SS形式）
            休暇の場合はnull
          example: "18:00:00"
        status:
          type: string
          enum: [WORK, PAID_LEAVE, SICK_LEAVE, UNPAID_LEAVE, PERSONAL_LEAVE, BUSINESS_TRIP]
          description: |
            勤怠ステータス
            - WORK: 出勤
            - PAID_LEAVE: 有給休暇
            - SICK_LEAVE: 病欠
            - UNPAID_LEAVE: 無給休暇
            - PERSONAL_LEAVE: 私用休暇
            - BUSINESS_TRIP: 出張
          example: "WORK"
        notes:
          type: string
          nullable: true
          description: 備考（休暇理由など）
          example: "家族旅行"
        createdAt:
          type: string
          format: date-time
          description: レコード作成日時
          example: "2024-11-18T09:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: レコード最終更新日時
          example: "2024-11-18T18:00:00Z"

    CreateLeaveRequest:
      type: object
      additionalProperties: false
      required:
        - date
        - leaveType
      properties:
        date:
          type: string
          format: date
          description: 休暇日（過去・当日・将来を指定可能）
          example: "2026-11-09"
        leaveType:
          $ref: '#/components/schemas/LeaveType'
        memo:
          type: string
          maxLength: 500
          description: 任意のメモ。省略、空文字、空白のみはメモなしとして保存し、notes は NULL にする。
          example: 体調不良
        confirmReplaceWork:
          type: boolean
          default: false
          description: 勤務行を休暇へ変えてよいか。true のときだけ出勤・退勤時刻を空にする。休暇行には適用しない。

    UpdateLeaveRequest:
      type: object
      additionalProperties: false
      required:
        - leaveType
      properties:
        leaveType:
          $ref: '#/components/schemas/LeaveType'
        memo:
          type: string
          maxLength: 500
          description: 省略、空文字、空白のみはメモなしとして扱う。日付はパスで指定し、このボディでは変更できない。
          example: 体調不良

    LeaveType:
      type: string
      description: 休暇区分。保存時は対応する勤怠ステータスコードに変換する。
      enum:
        - Sick Leave
        - Personal Leave
        - Business Trip

    LeaveRecord:
      type: object
      required:
        - date
        - leaveType
        - memo
      properties:
        date:
          type: string
          format: date
          description: 休暇日
          example: "2026-11-09"
        leaveType:
          $ref: '#/components/schemas/LeaveType'
        memo:
          type: string
          maxLength: 500
          description: メモがない場合は空文字。保存値 notes が NULL のときも空文字に正規化する。
          example: 体調不良

    ErrorResponse:
      type: object
      description: エラーレスポンス
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: エラーコード
          example: "Invalid input"
        message:
          type: string
          description: エラーメッセージ（日本語）
          example: "入力値が不正です"
        timestamp:
          type: string
          format: date-time
          description: エラー発生日時
          example: "2024-11-18T10:00:00Z"
        details:
          type: object
          description: エラーの詳細情報（オプション）
          additionalProperties: true
          example:
            field: "clockInTime"
            rejectedValue: "25:00:00"
            reason: "時刻の形式が不正です"
